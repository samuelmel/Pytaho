[project]
name = "pytaho"
version = "0.1.0"
description = "Transpilador de XML Pentaho (.ktr/.kjb) para Python POO com auto-detecção de banco de dados (Oracle, Postgres, etc.)"
readme = "README.md"
authors = [
    { name = "samuelmel", email = "samuca21santos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.1.0",
    "jinja2>=3.1.3",
    "pydantic>=2.7.0",
    "oracledb>=2.1.0",
    "polars>=1.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pyodbc>=5.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
]

[project.scripts]
pytaho = "pytaho.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
