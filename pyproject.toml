[project]
name = "pytaho"
version = "0.1.0"
description = "Modern Python ETL framework replacing Pentaho Data Integration"
readme = "README.md"
authors = [
    { name = "samuelmel", email = "samuca21santos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.4.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "connectorx>=0.3.3",
    "fastexcel>=0.11.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
]

[project.scripts]
pytaho = "pytaho:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
